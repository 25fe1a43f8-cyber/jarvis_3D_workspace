<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS 3D MODELS</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/chooser.css">
   <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2302070b' stroke='%2300eaff' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%2300bfff' stroke-width='2'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='Arial' font-size='34' font-weight='bold' fill='%23eaffff'%3EJ%3C/text%3E%3C/svg%3E"
/>
</head>
</head>
<body>

<div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="hud-wrapper">
    <div class="corner top-left"></div>
    <div class="corner top-right"></div>
    <div class="corner bottom-left"></div>
    <div class="corner bottom-right"></div>

    <div class="hud-panel">

        <!-- HEADER -->
        <div class="hud-header">
            <div class="header-title">
                <svg viewBox="0 0 24 24">
                    <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M12 12v9" />
                    <path d="m8 17 4-4 4 4" />
                </svg>
                MODEL UPLOAD
            </div>
            <div class="header-status">
                <span class="status-pill" id="voice-status">ONLINE</span>
                <span class="window-controls">&minus;</span>
                <span class="window-controls">&times;</span>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="hud-content">

            <!-- LEFT: DRAG & DROP SCANNER -->
            <div class="upload-zone" id="dropZone">
                <div class="scan-line"></div>
                <div class="radar-ring"></div>

                <svg class="upload-icon" viewBox="0 0 24 24">
                    <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242M12 12v9" />
                    <path d="m8 17 4-4 4 4" />
                </svg>

                <div class="upload-text-main" id="uploadTextMain">DRAG &amp; DROP MODEL</div>
                <div class="upload-text-sub" id="uploadTextSub">GLB / GLTF / OBJ / FBX</div>
                <div class="or-divider">- OR -</div>

                <button class="browse-btn" id="browseBtn">
                    <svg viewBox="0 0 24 24">
                        <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
                    </svg>
                    BROWSE FILES
                </button>

                <input type="file" id="fileInput" accept=".glb,.gltf,.obj,.fbx,image/*" style="display: none;">

                <div class="status-indicator" id="statusIndicator">
                    <div class="status-dot"></div>
                    <span id="statusText">SYS.READY</span>
                </div>
            </div>

            <!-- RIGHT: INFO + PREVIEW + 3D MODEL -->
            <div class="info-column">

                <div class="info-box">
                    <div class="box-title">SUPPORTED FORMATS</div>
                    <ul class="format-list">
                        <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> GLB</li>
                        <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> GLTF</li>
                        <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> OBJ</li>
                        <li><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg> FBX</li>
                    </ul>
                </div>

                <!-- Preview: BMW image + live 3D car model -->
                <div class="info-box preview-box">
                    <div class="box-title" style="position: absolute; top: 12px; left: 15px; width: calc(100% - 30px);">HOLO-PREVIEW</div>

                    <div class="preview-row">

                        <!-- Left: static BMW image with orbiting ring -->
                        <div class="preview-container">
                            <div class="orbit-ring"></div>
                            <div class="preview-base"></div>
                            <img
                                id="preview-image"
                                class="preview-image"
                                src="./assets/bmw_m4.jpg"
                                alt="BMW M4 preview"
                                onerror="this.style.display='none';document.getElementById('preview-cube').style.display='block';"
                            />
                            <svg id="preview-cube" class="preview-cube" viewBox="0 0 100 100" style="display:none;">
                                <polygon points="50,10 90,30 50,50 10,30" />
                                <polygon points="10,30 50,50 50,90 10,70" />
                                <polygon points="90,30 50,50 50,90 90,70" />
                                <line x1="50" y1="50" x2="50" y2="90" stroke-dasharray="2,2"/>
                                <circle cx="50" cy="10" r="2" fill="#00f3ff" />
                                <circle cx="90" cy="30" r="2" fill="#00f3ff" />
                                <circle cx="10" cy="30" r="2" fill="#00f3ff" />
                                <circle cx="50" cy="90" r="2" fill="#00f3ff" />
                            </svg>
                            <div class="preview-label">IMAGE</div>
                        </div>

                        <!-- Right: live 3D car model preview -->
                        <div class="model-container">
                            <div class="model-3d-wrap">
                                <div id="mini-canvas"></div>
                            </div>
                            <div class="preview-label">3D MODEL</div>
                        </div>

                    </div>
                </div>

                <div class="action-row">
                    <button id="btn-default" class="action-btn">◉ USE BMW M4</button>
                    <button id="btn-confirm" class="action-btn confirm" disabled>✓ CONFIRM</button>
                </div>

                <div id="chooser-log"></div>

            </div>
        </div>

        <div class="hud-footer">
            <div class="footer-lines">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

    </div>
</div>

<!-- Three.js for the mini 3D preview -->
<script type="importmap">
{
    "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
}
</script>

<script type="module" src="./js/chooser.js"></script>
</body>
</html>
